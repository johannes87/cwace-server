# HTTP fast-download for the cwace OpenArena servers.
# Installed to /etc/nginx/sites-available/cwace, symlinked into sites-enabled.
#
# Clients fetch <sv_dlURL>/<fs_game>/<file>.pk3, e.g.
#   http://10.0.1.120:8000/cmod/zzzz-cmod.pk3
#   http://10.0.1.120:8000/baseoa/pak0.pk3
# so the document root is the directory holding baseoa/ and cmod/ -- i.e. the
# same directory as CWACE_DIR in /etc/default/cwace.
# Keep this root in sync with CWACE_DIR by hand -- nginx cannot read that file.

server {
    listen      8000;
    listen      [::]:8000;
    # sv_dlURL uses the bare IP, so that is the Host clients send. This is
    # also the only server block on :8000, hence the default server for that
    # port -- any Host reaches it until a second vhost is added there.
    server_name 10.0.1.120;

    root /home/cwace-server/cwace-server;

    access_log /var/log/nginx/cwace-access.log;
    error_log  /var/log/nginx/cwace-error.log;

    # Only ever GET/HEAD a pk3. The client needs nothing else, and serving the
    # whole tree would expose cmod/*.cfg -- including q3config_server.cfg,
    # which the engine rewrites on shutdown and which holds rconpassword if
    # one is ever set.
    location ~* ^/(baseoa|cmod)/[^/]+\.pk3$ {
        limit_except GET HEAD { deny all; }

        # pk3 is a zip; recompressing wastes CPU on 97MB paks.
        gzip off;
        default_type application/octet-stream;

        # Large sequential reads, and resumable downloads for clients that
        # drop mid-transfer (nginx serves byte ranges for static files).
        sendfile   on;
        tcp_nopush on;

        # Content is immutable per filename -- new maps land as new pk3s.
        add_header Cache-Control "public, max-age=604800" always;

        try_files $uri =404;
    }

    # No directory listings, no config files, no surprises.
    location / {
        return 404;
    }
}
