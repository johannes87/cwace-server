// Server engine
//==============
seta sv_hostname "c-base CTF server"
seta sv_master1 ""
seta sv_master2 ""
// how many clients can connect to the server
seta sv_maxclients 28
seta sv_pure 1
seta vm_game 0
seta sv_fps 40
seta sv_maxRate 50000
// fX3 server specific
//seta sv_silentHeartbeat 1

// Game logic(mod or baseoa)
//==========================
// how many players are allowed to join the game for playing
seta g_maxGameClients "12"
// 0 is deathmatch, 1 is tourney, 2 is single player, 3 is team-deathmatch, 4 is CTF
seta g_gametype "4"
// 1 is just railgun, 2 is railgun + gauntlet
seta g_instantgib "0"
// the following makes the server use the built-in OA rotations(pseudo-random, a bit crappy but OK for the beginning)
seta g_autoNextMap "1"
//seta g_allowGametype "/0/1/2/3/4/5/6/7/8/"
seta g_voteNames "/map_restart/nextmap/map/g_gametype/kick/clientkick/g_doWarmup/timelimit/fraglimit/shuffle/custom/"
sets g_allowVote "1"
seta g_regen "0"
// N2F amd some other mods use this
seta g_railjump "0"
seta g_delagHitscan "1"
seta g_lagLightning "0"

// Physics settings
//=================
// the 3 following CVars make it feel like :F which uses integers and can make you glitch through thin walls or also stick on walls
seta pmove_msec "8"
seta pmove_fixed "0"
seta pmove_float "0"
// N2F-mod and pbrochart's AS specific, best game physics feeling you can get in OA/Q3
//seta pmove_accurate "125"

// Game settings
//==============
seta capturelimit "8"
seta fraglimit "20"
seta timelimit "10"
seta dmflags "0"
// don't set this to anything else than 0 if using stock OA/Q3
//seta g_inactivity "60"
// N2F-mod in OA compatibility mode uses this
//seta g_brightPlayers "2"
seta g_motdFile "motd_ctf.cfg"
seta g_log "games_ctf.log"


// Bot settings
//=============
seta bot_enable "1"
// the following is to tell how many bots - human players will be added, in team games this is (bots - human players) * 2 teams
seta bot_minplayers "2"
// mutes the bots both in team and deathmatch games, 1 is only deathmatch, single player  and tourney
seta bot_nochat "2"


exec common.cfg
